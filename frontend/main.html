<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SCMXpertLite</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- CSS STYLES -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a2e; /* Deep dark blue base */
        }

        .hero-section {
            height: 100vh;
            width: 100%;
            
            /* UPDATED BACKGROUND: Gradient + Image Fallback */
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9) 0%, rgba(22, 33, 62, 0.8) 100%), url('pics/back.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
            color: #ffffff;
            overflow: hidden;
        }

        .hero-content {
            position: relative; 
            z-index: 2;
            max-width: 1000px;
            padding: 20px;
            animation: slideUp 1s ease-out;
        }

        .welcome-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #4facfe;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }

        h2 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 40px;
            /* Gradient Text Logic */
            background: linear-gradient(to right, #ffffff, #a5a5a5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            position: relative;
            display: inline-block;
            padding: 18px 45px;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 50px;
            overflow: hidden;
            transition: 0.4s;
            z-index: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: -1;
            transition: 0.4s;
            border-radius: 50px;
        }

        .btn:hover::before {
            width: 100%;
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(118, 75, 162, 0.6);
            border-color: transparent;
            transform: translateY(-3px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h2 { font-size: 3rem; }
            .btn { width: 100%; margin-bottom: 10px; }
            .button-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Main Content -->
    <section class="hero-section">
        <div class="hero-content">
            <p class="welcome-text">WELCOME TO SCMXPERTLITE</p>
            <h2>Powering Smarter, Faster, and More Reliable Supply Chains.</h2>
            
            <div class="button-container">
                <a href="trail.html" class="btn">Log In</a>
                <a href="trail.html?form=signup-form" class="btn">Sign Up</a>
            </div>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Shipments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #333; color: white; margin: 0; padding-top: 80px; }
        .navbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.8); display: flex; align-items: center; padding: 0 30px; border-bottom: 1px solid #444; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; margin-right: auto; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { color: #ccc; text-decoration: none; font-weight: bold; }
        .nav-links a:hover { color: white; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { 
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.2); 
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.15); }

        .card h3 { color: #5654ff; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .card p { margin: 8px 0; font-size: 0.9em; color: #ddd; }
        .label { font-weight: bold; color: #aaa; margin-right: 5px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">SCMXpertLite</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="shipment.html">New Shipment</a></li>
            <li><a href="#" id="logout-btn">Log Out</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>All Shipments</h1>
        <div class="card-grid" id="shipment-grid">
            <p style="text-align:center; grid-column: 1/-1;">Loading shipments...</p>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.addEventListener('DOMContentLoaded', () => {
            loadShipments();

            const logoutBtn = document.getElementById("logout-btn");
            if(logoutBtn) {
                logoutBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await fetch(`${API_URL}/auth/logout`, { method: 'POST' });
                    window.location.href = 'trail.html';
                });
            }
        });

        async function loadShipments() {
            try {
                // Fetch from the correct backend endpoint
                const res = await fetch(`${API_URL}/shipment/shipments`);
                
                if (!res.ok) throw new Error("Failed to fetch data");
                
                const data = await res.json();
                const grid = document.getElementById('shipment-grid');
                grid.innerHTML = '';

                // Note: Your backend returns { "shipments": [...] }
                const shipments = data.shipments || [];

                if(shipments.length > 0) {
                    shipments.forEach(ship => {
                        // Filter out the bad data (the "string" placeholders)
                        if (ship.shipment_number === "string") return;

                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Format date nicely
                        let dateDisplay = ship.expected_delivery_date;
                        if(dateDisplay.includes('T')) dateDisplay = dateDisplay.split('T')[0];

                        card.innerHTML = `
                            <h3>${ship.shipment_number}</h3>
                            <p><span class="label">Container:</span> ${ship.container_number}</p>
                            <p><span class="label">Goods:</span> ${ship.goods_type}</p>
                            <p><span class="label">Device:</span> ${ship.device}</p>
                            <p><span class="label">Expected:</span> ${dateDisplay}</p>
                            <p><span class="label">Batch ID:</span> ${ship.batch_id}</p>
                            <p><span class="label">Description:</span> ${ship.shipment_description}</p>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No shipments found.</p>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('shipment-grid').innerHTML = '<p style="text-align:center; color: #ff6b6b; grid-column: 1/-1;">Error loading data from server.</p>';
            }
        }
    </script>
</body>
</html>

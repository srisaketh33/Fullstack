<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SCMXpertLite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* DASHBOARD CSS */
        body { font-family: Arial, sans-serif; margin: 0; background-color: #333; background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('pics/dash.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .main-header { background-color: transparent; padding: 0 30px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .header-brand h3 { margin: 0; color: #ffffff; font-size: 1.5em; }
        .top-nav ul { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
        .top-nav li a { position: relative; display: block; color: #bdc3c7; text-decoration: none; padding: 25px 20px; font-weight: 500; transition: color 0.5s; }
        .top-nav li a:hover, .top-nav li.active a { color: #ffffff; }
        .main-content { padding: 20px 50px 50px 50px; text-align: center; }
        .welcome-banner { margin-top: 30px; margin-bottom: 60px; }
        .welcome-banner h2 { font-size: 2.8em; color: #ffffff; font-weight: 300; }
        .cta-container { display: flex; gap: 60px; margin-top: 30px; justify-content: center; }
        .cta-panel { flex: 1; max-width: 450px; text-align: center; }
        .cta-panel h3 { font-size: 1.8em; color: #ffffff; margin-bottom: 25px; }
        .cta-panel button { padding: 15px 35px; border: 2px solid #ffffff; background-color: transparent; color: #ffffff; border-radius: 30px; cursor: pointer; font-size: 1em; font-weight: bold; transition: all 0.3s ease; }
        .cta-panel button:hover { background-color: #ffffff; color: #2c3e50; transform: translateY(-3px); }
    </style>
</head>
<body>
    <main class="main-content">
        <header class="main-header">
            <div class="header-brand"><h3>SCMXpertLite</h3></div>
            
            <!-- FIXED NAVBAR -->
            <nav class="top-nav">
                <ul>
                    <li class="active"><a href="dashboard.html"><span><i class="fas fa-tachometer-alt"></i> Dashboard</span></a></li>
                    <li><a href="profile.html"><span><i class="fas fa-user"></i> My Account</span></a></li>
                    <li><a href="my_shipments.html"><span><i class="fas fa-box"></i> My Shipment</span></a></li>
                    <li><a href="shipment.html"><span><i class="fas fa-plus-circle"></i> New Shipment</span></a></li>
                    <li><a href="device_data.html"><span><i class="fas fa-chart-line"></i> Device Data</span></a></li>
                    <li><a href="#" id="logout-button"><span><i class="fas fa-sign-out-alt"></i> Log out</span></a></li>
                    <li id="admin-link" style="display:none;"><a href="admin.html"><span><i class="fas fa-users-cog"></i> Admin</span></a></li>
                </ul>
            </nav>
        </header>

        <div class="welcome-banner">
            <h2>Hi <span id="username">User</span>, Welcome to SCMXpertLite</h2>
        </div>

        <div class="cta-container">
            <div class="cta-panel">
                <h3>Create a New Shipment</h3>
                <button onclick="window.location.href='shipment.html'">CREATE SHIPMENT</button>
            </div>
            <div class="cta-panel">
                <h3>To see Device Data Stream</h3>
                <button onclick="window.location.href='device_data.html'">DEVICE DATA STREAM</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check session
            try {
                const response = await fetch('http://127.0.0.1:8000/auth/me');
                if (response.ok) {
                    const userData = await response.json();
                    document.getElementById('username').textContent = userData.username;
                    if (userData.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'block';
                    }
                } else {
                    window.location.href = 'trail.html';
                }
            } catch (e) {
                window.location.href = 'trail.html';
            }

            // Logout
            document.getElementById('logout-button').addEventListener('click', async (e) => {
                e.preventDefault();
                await fetch('http://127.0.0.1:8000/auth/logout', { method: 'POST' });
                localStorage.clear();
                window.location.href = 'trail.html';
            });
        });
    </script>
</body>
</html>

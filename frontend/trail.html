<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCM Authentication</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --dark: #1f2029;
            --light: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #121212;
            background-image: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.8) 100%), url('pics/back.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-weight: 700;
            margin: 0;
            color: var(--light);
            margin-bottom: 15px;
        }

        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 24px;
            margin: 20px 0 30px;
            color: #e0e0e0;
        }

        span {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 15px;
            display: block;
        }

        a {
            color: var(--secondary);
            font-size: 14px;
            text-decoration: none;
            margin: 15px 0;
            transition: 0.3s;
        }

        button {
            border-radius: 50px;
            border: 1px solid var(--secondary);
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 14px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
            margin-top: 10px;
        }

        button:active { transform: scale(0.95); }
        button:focus { outline: none; }
        
        button.ghost {
            background: transparent;
            border-color: #FFFFFF;
            box-shadow: none;
        }

        /* --- FIX: Added Solid Background to Form --- */
        form {
            background-color: #1f2029; /* Solid Dark Background to stop overlap */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        input {
            background-color: #2b2e38;
            border: 1px solid #444;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            color: white;
            transition: 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #383b48;
        }

        .container {
            background-color: #1f2029;
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.5), 
                        0 10px 10px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 550px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        /* Animation to swap panels */
        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: linear-gradient(to right, #8f94fb, #4e54c8);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: #FFFFFF;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        .social-container { margin: 20px 0; }
        .social-container a {
            border: 1px solid #DDDDDD;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: white;
            transition: 0.3s;
        }
        .social-container a:hover { background: white; color: var(--primary); }
    </style>
</head>
<body>

    <div class="container" id="container">
        
        <!-- Sign Up Form (Left when active) -->
        <div class="form-container sign-up-container">
            <form id="signup-form">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" id="signup-username" placeholder="Username" required />
                <input type="email" id="signup-email" placeholder="Email" required />
                <input type="password" id="signup-password" placeholder="Password" required />
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- Sign In Form (Right by default) -->
        <div class="form-container sign-in-container">
            <form id="login-form">
                <h1>Sign in</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your account</span>
                <input type="email" id="login-email" placeholder="Email" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <a href="forgot_password.html" style="color: #bbb; margin: 10px 0; display:block;">Forgot your password?</a>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- Sliding Overlay -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Javascript -->
    <script>
        // Use current origin to avoid host mismatch (127.0.0.1 vs localhost)
        const API_URL = window.location.origin;

        document.addEventListener('DOMContentLoaded', () => {
            const signUpButton = document.getElementById('signUp');
            const signInButton = document.getElementById('signIn');
            const container = document.getElementById('container');

            // --- Animation Listeners ---
            signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
            signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));

            // --- Check URL Params ---
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('form') === 'signup-form') {
                container.classList.add("right-panel-active");
            }

            // --- Sign Up Logic ---
            const signupForm = document.getElementById('signup-form');
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('signup-username').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                try {
                    const response = await fetch(`${API_URL}/user/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password }),
                        credentials: 'include'
                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert("Account created successfully! Please Log In.");
                        container.classList.remove("right-panel-active");
                        signupForm.reset();
                    } else {
                        alert(`Registration Failed: ${data.detail || 'Error'}`);
                    }
                } catch (error) {
                    alert("Failed to connect to server.");
                }
            });

            // --- Login Logic ---
            const loginForm = document.getElementById('login-form');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    const response = await fetch(`${API_URL}/user/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                        // Ensure cookie from Set-Cookie is stored in browser
                        credentials: 'include'
                    });
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('username', data.username);
                        localStorage.setItem('role',data.role);
                        localStorage.setItem('access_token',data.access_token);
                        window.location.href = "dashboard.html"; 
                       
                    } else {
                        alert(`Login Failed: ${data.detail || 'Invalid credentials'}`);
                    }
                } catch (error) {
                    alert("Failed to connect to server.");
                }
            });
        });
    </script>
</body>
</html>

<!-- frontend/admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Reuse similar CSS from dashboard/device_data for consistency */
        body { font-family: sans-serif; background-color: #333; color: white; margin: 0; padding-top: 80px; }
        .navbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-sizing: border-box; }
        .navbar a { color: #ccc; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .container { max-width: 1000px; margin: 40px auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: white; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { background-color: #5654ff; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="font-size: 1.5rem; font-weight: bold;">SCMXpertLite Admin</div>
        <div>
            <a href="dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1>User Management</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>

    <script>
        async function fetchUsers() {
            try {
                // Because we use Cookies, we don't need to manually send headers!
                const response = await fetch('http://127.0.0.1:8000/user/all');
                
                if (response.status === 401 || response.status === 403) {
                    alert("Unauthorized. Admins only.");
                    window.location.href = 'dashboard.html';
                    return;
                }
                
                const users = await response.json();
                const tbody = document.getElementById('user-table-body');
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${user.id}</td><td>${user.username}</td><td>${user.email}</td><td>${user.role}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }
        fetchUsers();
    </script>
</body>
</html>

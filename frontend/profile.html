<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - SCMXpertLite</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- General Reset --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #1a1a2e; 
            color: white; 
            padding-top: 100px; 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
            
            /* FIXED: Correct Background Syntax */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pics/account.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* --- Navbar (Matches Dashboard & Other Pages) --- */
        .navbar { 
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 40px; z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 1px; }

        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links li a { 
            color: #ccc; text-decoration: none; font-size: 0.9rem; 
            font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.3s; 
        }
        .nav-links li a:hover, .nav-links li a.active { 
            color: #8f94fb; text-shadow: 0 0 8px rgba(143, 148, 251, 0.4); 
        }

        /* --- Glass Panel --- */
        .glass-panel { 
            background: rgba(30, 30, 40, 0.75); 
            backdrop-filter: blur(15px); 
            padding: 50px; 
            border-radius: 20px; 
            width: 500px; 
            max-width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease-out;
            height: fit-content;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h2 { text-align: center; margin-bottom: 30px; font-weight: 300; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .section { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 30px; }
        
        h3 { border-left: 4px solid #4e54c8; padding-left: 15px; margin-bottom: 20px; font-weight: 600; color: #fff; }
        
        label { display: block; margin-bottom: 8px; color: #8f94fb; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; }
        
        input { 
            width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.2); background: #2b2e38; 
            color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #8f94fb; background: #383b48; box-shadow: 0 0 10px rgba(143, 148, 251, 0.2); }
        
        button { 
            width: 100%; padding: 14px; background: linear-gradient(135deg, #4e54c8, #8f94fb); 
            color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; 
            font-weight: bold; letter-spacing: 1px; transition: 0.3s; text-transform: uppercase;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(78, 84, 200, 0.4); }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        .btn-danger:hover {
             box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>
<body>
    
    <!-- Updated Navbar with full links -->
    <nav class="navbar">
        <div class="logo">SCMXpertLite</div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> My Account</a></li>
            <li><a href="my_shipments.html"><i class="fa-solid fa-box-open"></i> My Shipment</a></li>
            <li><a href="shipment.html"><i class="fa-solid fa-circle-plus"></i> New Shipment</a></li>
            <li><a href="device_data.html"><i class="fa-solid fa-chart-line"></i> Device Data</a></li>
            <li><a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log out</a></li>
        </ul>
    </nav>

    <div class="glass-panel">
        <h2>My Profile</h2>

        <!-- Update Details Section -->
        <div class="section">
            <h3>Update Details</h3>
            <label>Username</label>
            <input type="text" id="username_input" placeholder="Username">
            <label>Email</label>
            <input type="email" id="email_input" placeholder="Email">
            <button onclick="updateDetails()">Save Changes</button>
        </div>

        <!-- Change Password Section -->
        <div class="section" style="border: none; padding-bottom: 0; margin-bottom: 0;">
            <h3>Change Password</h3>
            <input type="password" id="old-pass" placeholder="Current Password">
            <input type="password" id="new-pass" placeholder="New Password">
            <button class="btn-danger" onclick="changePassword()">Update Password</button>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Fetch User Data
            try {
                const res = await fetch(`${API_URL}/auth/me`, { credentials: 'include' });
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('username_input').value = data.username;
                    document.getElementById('email_input').value = data.email;
                } else {
                    alert("Session expired. Please login again.");
                    window.location.href = 'trail.html';
                }
            } catch (e) {
                console.error(e);
            }

            // 2. Handle Logout
            document.getElementById('logout-btn').addEventListener('click', async (e) => {
                e.preventDefault();
                await fetch(`${API_URL}/auth/logout`, { method: 'POST', credentials: 'include' });
                window.location.href = 'trail.html';
            });
        });

        // 3. Update Details Logic
        async function updateDetails() {
            const username = document.getElementById('username_input').value;
            const email = document.getElementById('email_input').value;

            const payload = {};
            if(username) payload.username = username;
            if(email) payload.email = email;

            try {
                const res = await fetch(`${API_URL}/user/profile/update`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();

                if(res.ok) {
                    if(data.action === "logout") {
                        alert(data.message);
                        window.location.href = 'trail.html';
                    } else {
                        alert("Details updated successfully!");
                    }
                } else {
                    alert(`Update failed: ${data.detail}`);
                }
            } catch (error) {
                console.error(error);
                alert("Server connection error.");
            }
        }

        // 4. Change Password Logic
        async function changePassword() {
            const oldPass = document.getElementById('old-pass').value;
            const newPass = document.getElementById('new-pass').value;

            if(!oldPass || !newPass) {
                alert("Please enter both old and new passwords.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/user/profile/change-password`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({old_password: oldPass, new_password: newPass})
                });

                if(res.ok) {
                    alert("Password changed successfully! Please use the new password next time.");
                    document.getElementById('old-pass').value = '';
                    document.getElementById('new-pass').value = '';
                } else {
                    const d = await res.json();
                    alert(`Error: ${d.detail}`);
                }
            } catch (error) {
                console.error(error);
                alert("Server connection error.");
            }
        }
    </script>
</body>
</html>

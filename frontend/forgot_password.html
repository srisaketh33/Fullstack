<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - SCMXpertLite</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1f2029;
            background-image: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.8) 100%), url('pics/back.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }
        .container {
            background-color: #1f2029;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-bottom: 20px; color: #fff; }
        p { color: #ccc; font-size: 14px; margin-bottom: 30px; }
        input {
            background-color: #2b2e38;
            border: 1px solid #444;
            padding: 12px 15px;
            width: 100%;
            border-radius: 8px;
            color: white;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            border-radius: 50px;
            border: 1px solid #8f94fb;
            background: linear-gradient(to right, #4e54c8, #8f94fb);
            color: #FFFFFF;
            font-weight: bold;
            padding: 12px 45px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 15px rgba(143, 148, 251, 0.5); }
        .back-link { display: block; margin-top: 20px; color: #8f94fb; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p id="step-text">Enter your email address to receive an OTP.</p>

        <!-- Step 1: Request OTP -->
        <form id="forgot-form">
            <input type="email" id="email" placeholder="Enter your email" required />
            <button type="submit">Send OTP</button>
        </form>

        <!-- Step 2: Verify OTP -->
        <form id="otp-form" style="display:none; margin-top: 10px;">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" />
            <button type="button" id="verify-otp-btn">Verify OTP</button>
        </form>

        <!-- Step 3: Reset Password -->
        <form id="reset-form" style="display:none; margin-top: 10px;">
            <input type="password" id="new-password" placeholder="New Password" />
            <input type="password" id="confirm-password" placeholder="Confirm New Password" />
            <button type="button" id="reset-pass-btn">Change Password</button>
        </form>

        <a href="trail.html" class="back-link">Back to Login</a>
    </div>

    <script>
        const API_URL = window.location.origin;

        // Step 1: Request OTP
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert('Please enter your email.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('If an account exists, an OTP has been sent to your email.');
                    document.getElementById('email').setAttribute('disabled', 'true');
                    document.getElementById('otp-form').style.display = 'block';
                    document.getElementById('step-text').textContent = 'Enter the OTP sent to your email.';
                } else {
                    alert(data.detail || 'Error sending OTP');
                }
            } catch (error) {
                console.error(error);
                alert('Server error.');
            }
        });

        // Step 2: Verify OTP
        document.getElementById('verify-otp-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            if (!otp) {
                alert('Please enter the OTP.');
                return;
            }
            try {
                const response = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, otp })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('OTP verified. You can now set a new password.');
                    document.getElementById('reset-form').style.display = 'block';
                    document.getElementById('step-text').textContent = 'Enter your new password.';
                } else {
                    alert(data.detail || 'Invalid OTP');
                }
            } catch (error) {
                console.error(error);
                alert('Server error.');
            }
        });

        // Step 3: Reset Password
        document.getElementById('reset-pass-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            if (!newPassword || !confirmPassword) {
                alert('Please enter and confirm your new password.');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }
            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, otp, new_password: newPassword })
                });
                const data = await response.json();
                if (response.ok) {
                    alert('Password updated. You can now log in with the new password.');
                    window.location.href = 'trail.html';
                } else {
                    alert(data.detail || 'Error resetting password');
                }
            } catch (error) {
                console.error(error);
                alert('Server error.');
            }
        });
    </script>
</body>
</html>
